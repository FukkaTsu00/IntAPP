<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaintAI : client web</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 16px;
  }

  label {
    display: block;
    margin-top: 12px;
  }

  input {
    width: 100%;
    padding: 6px;
    box-sizing: border-box;
  }

  button {
    margin-top: 16px;
    padding: 8px 16px;
    cursor: pointer;
  }

  #result {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    white-space: pre-wrap;
  }

  .ok { background: #e6f4ea; }
  .alert { background: #fde7e7; }
  .err { background: #fff4e5; }
</style>
</head>

<body>
<h1>MaintAI</h1>

<label>
  URL de l'API
  <input id="url" value="http://localhost:8000">
</label>

<label>
  Clé API
  <input id="key" type="password">
</label>

<label>
  Température (°C)
  <input id="temperature_c" type="number" step="0.1" value="72">
</label>

<label>
  Vibration (mm/s)
  <input id="vibration_mm_s" type="number" step="0.1" value="6">
</label>

<label>
  Charge (%)
  <input id="load_pct" type="number" step="1" value="85">
</label>

<label>
  Heures de fonctionnement
  <input id="runtime_hours" type="number" step="100" value="15000">
</label>

<button id="go">Prédire</button>
<div id="result"></div>

<script>
const FEATURES = [
  "temperature_c",
  "vibration_mm_s",
  "load_pct",
  "runtime_hours"
];

const show = (cls, text) => {
  const r = document.getElementById("result");
  r.className = cls;
  r.textContent = text;
};

document.getElementById("go").addEventListener("click", async () => {
  const button = document.getElementById("go");

  try {
    const url = document.getElementById("url").value.trim().replace(/\/+$/, "");
    const apiKey = document.getElementById("key").value.trim();

    if (!url || !apiKey) {
      show("err", "Veuillez saisir l'URL de l'API et la clé API.");
      return;
    }

    const reading = Object.fromEntries(
      FEATURES.map(f => [
        f,
        Number(document.getElementById(f).value)
      ])
    );

    if (FEATURES.some(f => document.getElementById(f).value.trim() === "" ||
        !Number.isFinite(reading[f]))) {
      show("err", "Veuillez saisir des valeurs numériques valides.");
      return;
    }

    button.disabled = true;
    show("", "Prédiction en cours...");

    const response = await fetch(`${url}/v1/predict`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": apiKey
      },
      body: JSON.stringify(reading)
    });

    // Une erreur peut arriver sans corps JSON : on ne plante pas dessus
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      // 401 / 503 : detail est un texte ; 422 : une liste d'erreurs Pydantic
      const detail = Array.isArray(data.detail)
        ? data.detail.map(d => `${d.loc.at(-1)} : ${d.msg}`).join("\n")
        : data.detail ?? response.statusText;
      show("err", `Erreur HTTP ${response.status}\n${detail}`);
      return;
    }

    const pct = (data.failure_probability * 100).toFixed(1);
    show(
      data.alert ? "alert" : "ok",
      (data.alert ? "ALERTE : risque de panne" : "Fonctionnement normal") +
        `\nProbabilité de panne : ${pct} % (seuil ${data.threshold * 100} %)` +
        `\nModèle : ${data.model_version}`
    );

  } catch (error) {
    show(
      "err",
      "Impossible de contacter l'API. Vérifiez son URL, son état et la configuration CORS."
    );
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
